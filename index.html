<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Days without Walhalla Water woes</title>
<style>
  :root {
    --bg: #f6f5f2;
    --ink: #161616;
    --muted: #5c5c5c;
    --line: #e4e1db;
    --ok: #1f6b3a;
    --warn: #8a5a00;
    --bad: #9b1c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
  }
  main {
    width: min(34rem, calc(100% - 2.5rem));
    text-align: center;
  }
  .kicker {
    font-size: .78rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: clamp(1.15rem, 3vw, 1.35rem);
    font-weight: 550;
    margin: 0 0 1.25rem;
  }
  .days {
    font-size: clamp(5rem, 20vw, 7.5rem);
    font-weight: 620;
    letter-spacing: -.04em;
    line-height: .9;
    margin: 0 0 .9rem;
  }
  .pill {
    display: inline-block;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .35rem .8rem;
    font-size: .8rem;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .active { color: var(--bad); }
  .recent { color: var(--warn); }
  .cleared { color: var(--ok); }
  .blurb {
    color: var(--muted);
    font-size: .98rem;
    line-height: 1.5;
    margin: 1.15rem 0 2rem;
  }
  .meta {
    border-top: 1px solid var(--line);
    padding-top: 1.1rem;
    color: var(--muted);
    font-size: .86rem;
    line-height: 1.7;
  }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="kicker">Walhalla Water</div>
  <h1>Days without water woes</h1>
  <div class="days cleared">2</div>
  <div class="pill cleared">Cleared</div>
  <p class="blurb">No current advisory or outage is indicated.</p>
  <div class="meta">
    Last incident: 2026-08-20<br>
    Cleared: 2026-08-20<br>
    Last checked: 2026-08-22 10:41 UTC<br>
    <a href="https://www.cityofwalhalla.com/departments/public-utilities/">Official Public Utilities page</a>
  </div>
</main>
</body>
</html>
