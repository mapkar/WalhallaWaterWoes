name: Update water status
on:
  schedule:
    - cron: "20 * * * *"   # hourly
  workflow_dispatch:        # run by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape and rebuild
        run: python3 update.py
      - name: Commit if changed
        run: |
          if [ "$(cat .changed)" != "1" ]; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html status.json
          git commit -m "Update Walhalla water status"
          git push